name: EBike original images
on:
  push:
    branches: [ebike-gibraltar-concept]
    paths: [.github/workflows/ebike-original-images.yml]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download originals from the operator website
        run: |
          mkdir originals
          python3 - <<'PY'
          import urllib.request,pathlib,json,concurrent.futures
          urls={
          'bike-original.jpeg':'https://ebike-gibraltar.com/shop/image/catalog/RMbikes/delite%20gt%20touring.jpeg',
          'rider-original.jpg':'https://ebike-gibraltar.com/shop/image/catalog/RM_MY2021_Delite.jpg',
          'ride-film.mp4':'https://ebike-gibraltar.com/video/ebike-intro-vid_1200.mp4?9'
          }
          def load(item):
              name,url=item
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=60).read(80000000)
                  pathlib.Path('originals',name).write_bytes(data)
                  print(name,len(data))
              except Exception as e: print(name,str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: list(pool.map(load,urls.items()))
          pathlib.Path('originals/sources.json').write_text(json.dumps(urls,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ebike-originals
          path: originals
          retention-days: 3
