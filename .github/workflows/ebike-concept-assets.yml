name: EBike concept assets
on:
  push:
    branches: [ebike-gibraltar-concept]
    paths: [.github/workflows/ebike-concept-assets.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect public website reference assets
        run: |
          mkdir -p reference-assets
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, pathlib, json, concurrent.futures
          root = pathlib.Path('reference-assets')
          base = 'https://ebike-gibraltar.com/'
          pages = ['', 'tours/small-group-guided-tour---rock-to-the-top.php', 'tours/small-group-guided-tour---rock-around-gibraltar.php', 'tours/ebike-rental---full-or-half-day.php', 'shop/ebikes/commuter-bikes/rm-delite-gt-touring', 'find-us.php']
          candidates=set()
          sources={}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'}), timeout=25).read()
          for i,p in enumerate(pages):
              try:
                  u=urllib.parse.urljoin(base,p)
                  s=get(u).decode('utf-8','replace')
                  (root/('page-'+str(i)+'.html')).write_text(s)
                  sources[u]='page-'+str(i)+'.html'
                  refs=re.findall(r'''(?:src|href|poster|data-src)=["']([^"']+)["']|url\(["']?([^\)"']+)''',s)
                  for a,b in refs:
                      v=urllib.parse.urljoin(u,a or b)
                      if re.search(r'\.(?:jpg|jpeg|png|webp|mp4|webm|css)(?:\?|$)',v,re.I): candidates.add(v)
              except Exception as e: print('PAGE ERROR',p,str(e))
          for u in list(candidates):
              if re.search(r'\.css(?:\?|$)',u):
                  try:
                      css=get(u).decode('utf-8','replace')
                      (root/('style-'+str(len(sources))+'.css')).write_text(css)
                      sources[u]='css'
                      for m in re.findall(r'''url\(["']?([^\)"']+)''',css):
                          v=urllib.parse.urljoin(u,m)
                          if re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',v,re.I): candidates.add(v)
                  except Exception as e: print('CSS ERROR',str(e))
          def save(u):
              if any(x in u.lower() for x in ['waydoo','efoil','flyer','leaderboard','logo-corner','captcha']): return None
              if not re.search(r'\.(?:jpg|jpeg|png|webp|mp4|webm)(?:\?|$)',u,re.I): return None
              if not urllib.parse.urlparse(u).netloc.endswith('ebike-gibraltar.com'): return None
              name=str(abs(__import__('zlib').crc32(u.encode())))+'-'+urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1])
              try:
                  d=get(u)
                  if len(d)>60000000: return None
                  (root/name).write_bytes(d)
                  print('ASSET',len(d),u)
                  return {'url':u,'file':name,'bytes':len(d)}
              except Exception as e: print('ASSET ERROR',u,str(e)); return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              files=[x for x in pool.map(save,sorted(candidates)) if x]
          (root/'manifest.json').write_text(json.dumps({'files':files,'sources':sources,'candidates':sorted(candidates)},indent=2))
          print('COLLECTED',len(files),'assets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ebike-reference-assets
          path: reference-assets
          retention-days: 3
